{% extends 'plantillaPrincipal.html' %}
{% load static %}
{% block contenido %}
    <div class="container">
        <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <br>
                <h1><b>Actualizar Servicio Extra</b></h1>
                <hr>
                <form id="form_editar_servicio" action="/procesar-actualizacion-servicio/" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="id" value="{{ servicio.id }}" readonly>

                    <b>Nombre del Servicio:</b> <br>
                    <input required placeholder="Ingrese el nombre del servicio" class="form-control" type="text" name="nombre" value="{{ servicio.nombre }}">
                    <br>

                    <b>Descripción:</b> <br>
                    <textarea placeholder="Ingrese una descripción del servicio" class="form-control" name="descripcion" rows="3">{{ servicio.descripcion }}</textarea>
                    <br>

                    <b>Precio:</b> <br>
                    <input required placeholder="Ingrese el precio" class="form-control" type="number" step="0.01" name="precio" value="{{ servicio.precio }}">
                    <br> <br>

                    <div style="text-align: center;">
                        <button class="btn btn-success" type="submit">
                            <i class="bi bi-check-circle"></i> Actualizar
                        </button>
                        <a href="/servicios/" class="btn btn-danger">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
                <br>
            </div>
        </div>
    </div>

    <script>
        $("#form_editar_servicio").validate({
            rules:{
                nombre:{
                    required: true,
                    minlength: 3
                },
                precio:{
                    required: true,
                    min: 0,
                    number: true
                }
            },
            messages:{
                nombre:{
                    required: "Por favor ingrese el nombre del servicio",
                    minlength: "Debe ingresar al menos 3 caracteres"
                },
                precio:{
                    required: "Por favor ingrese el precio del servicio",
                    min: "El precio debe ser un valor mayor o igual a 0",
                    number: "Por favor ingrese un monto válido"
                }
            }
        });
    </script>
{% endblock %}
