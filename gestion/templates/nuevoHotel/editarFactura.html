{% extends 'plantillaPrincipal.html' %}
{% load static %}
{% block contenido %}
    <div class="container">
        <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <br>
                <h1><b>Actualizar Factura</b></h1>
                <hr>
                <form id="form_editar_factura" action="/procesar-actualizacion-factura/" method="post">
                    {% csrf_token %}
                    <input type="hidden" name="id" value="{{ factura.id }}" readonly>

                    <b>Número de Factura:</b> <br>
                    <input class="form-control" type="text" value="{{ factura.numero_factura }}" disabled>
                    <br>

                    <b>Total:</b> <br>
                    <input required placeholder="Ingrese el total" class="form-control" type="number" step="0.01" name="total" value="{{ factura.total }}">
                    <br>

                    <b>Estado:</b> <br>
                    <select class="form-control" name="estado">
                        <option value="pendiente" {% if factura.estado == 'pendiente' %}selected{% endif %}>Pendiente</option>
                        <option value="pagada" {% if factura.estado == 'pagada' %}selected{% endif %}>Pagada</option>
                        <option value="anulada" {% if factura.estado == 'anulada' %}selected{% endif %}>Anulada</option>
                    </select>
                    <br>

                    <b>Método de Pago:</b> <br>
                    <select class="form-control" name="metodo_pago">
                        <option value="Efectivo" {% if factura.metodo_pago == 'Efectivo' %}selected{% endif %}>Efectivo</option>
                        <option value="Tarjeta" {% if factura.metodo_pago == 'Tarjeta' %}selected{% endif %}>Tarjeta</option>
                        <option value="Transferencia" {% if factura.metodo_pago == 'Transferencia' %}selected{% endif %}>Transferencia</option>
                    </select>
                    <br> <br>

                    <div style="text-align: center;">
                        <button class="btn btn-success" type="submit">
                            <i class="bi bi-check-circle"></i> Actualizar
                        </button>
                        <a href="/facturas/" class="btn btn-danger">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                    </div>
                </form>
                <br>
            </div>
        </div>
    </div>

    <script>
        $("#form_editar_factura").validate({
            rules:{
                total:{
                    required: true,
                    min: 0,
                    number: true
                },
                estado:{
                    required: true
                },
                metodo_pago:{
                    required: true
                }
            },
            messages:{
                total:{
                    required: "Por favor ingrese el total de la factura",
                    min: "El valor debe ser mayor o igual a 0",
                    number: "Por favor ingrese un monto válido"
                },
                estado:{
                    required: "Por favor seleccione un estado"
                },
                metodo_pago:{
                    required: "Por favor seleccione un método de pago"
                }
            }
        });
    </script>
{% endblock %}
