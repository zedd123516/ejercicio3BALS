{% extends 'plantillaPrincipal.html' %}
{% block contenido %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-5">
          <h2 class="text-center mb-4 fw-bold">Registro de Cliente</h2>
          
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}

          <form method="POST">
            {% csrf_token %}
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="nombres" class="form-label">Nombres</label>
                <input type="text" class="form-control" id="nombres" name="nombres" required
                  oninvalid="this.setCustomValidity('Por favor, rellena este campo.')"
                  oninput="this.setCustomValidity('')">
              </div>
              <div class="col-md-6 mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="apellidos" name="apellidos" required
                  oninvalid="this.setCustomValidity('Por favor, rellena este campo.')"
                  oninput="this.setCustomValidity('')">
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="documento" class="form-label">Cédula</label>
                <input type="text" class="form-control" id="documento" name="documento" required
                  oninvalid="this.setCustomValidity('Por favor, rellena este campo.')"
                  oninput="this.setCustomValidity('')">
              </div>
              <div class="col-md-6 mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono">
              </div>
            </div>

            <div class="mb-3">
              <label for="nacionalidad" class="form-label">Nacionalidad</label>
              <input type="text" class="form-control" id="nacionalidad" name="nacionalidad" value="Ecuador">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" required
                oninvalid="if(this.validity.valueMissing){this.setCustomValidity('Por favor, rellena este campo.')}else if(this.validity.typeMismatch){this.setCustomValidity('Por favor, ingresa un correo electrónico válido.')}"
                oninput="this.setCustomValidity('')">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required
                  oninvalid="this.setCustomValidity('Por favor, rellena este campo.')"
                  oninput="this.setCustomValidity('')">
              </div>
              <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required
                  oninvalid="this.setCustomValidity('Por favor, rellena este campo.')"
                  oninput="this.setCustomValidity('')">
              </div>
            </div>

            <div class="mb-3">
              <label for="password_confirm" class="form-label">Confirmar Contraseña</label>
              <input type="password" class="form-control" id="password_confirm" name="password_confirm" required
                oninvalid="this.setCustomValidity('Por favor, rellena este campo.')"
                oninput="this.setCustomValidity('')">
            </div>

            <button type="submit" class="btn btn-success w-100 mb-3">Registrarse</button>
          </form>

          <hr>

          <p class="text-center mb-0">
            ¿Ya tienes cuenta? <a href="/login/">Inicia sesión aquí</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
